name: Validate persona
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate runtime and audit consistency
        run: python3 scripts/validate.py
      - name: Test current and historical integrity boundaries
        run: python3 -B -m unittest discover -s tests -v
